name: Test Suite & Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter & Typecheck
        run: npm run check

      - name: Run Test Suite
        run: npm test

      - name: Verify Policies Configuration
        run: node -e "const fs = require('fs'); const yaml = fs.readFileSync('policies.yaml', 'utf8'); if (!yaml.includes('arret_urgence')) throw new Error('policies.yaml invalide'); console.log('Policies validated');"
