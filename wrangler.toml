# Configuration Cloudflare Workers + Static Assets pour Equipage
# Hébergement officiel : https://equipage.lelab.ai

name = "equipage"
main = "functions/worker.ts"
compatibility_date = "2024-11-01"

routes = [
  { pattern = "equipage.lelab.ai", custom_domain = true }
]

[vars]
SITE_URL = "https://equipage.lelab.ai"
EMERGENCY_STOP = "false"
ENVIRONMENT = "production"

[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "equipage-d1"
database_id = "87fab540-10ea-45b5-a83d-79a86ef06fb8"

[ai]
binding = "AI"

[env.staging]
name = "equipage-staging"
workers_dev = true

[[env.staging.d1_databases]]
binding = "DB"
database_name = "equipage-d1-staging"
database_id = "00000000-0000-0000-0000-000000000001"
